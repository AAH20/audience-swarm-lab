[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2z-audience-swarm-lab"
version = "0.1.0"
description = "Reproducible synthetic audience experiments and inspectable matching baselines"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
audience-lab = "audience_swarm_lab.cli:main"

[tool.setuptools.packages.find]
include = ["audience_swarm_lab*"]
